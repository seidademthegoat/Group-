<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVICTUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --bg-soft: #0f0f0f;
            --text: #e8e6e1;
            --text-dim: #6b6b6b;
            --text-mid: #9a9a9a;
            --gold: #c9a961;
            --gold-dim: rgba(201, 169, 97, 0.35);
            --gold-faint: rgba(201, 169, 97, 0.12);
            --line: rgba(255, 255, 255, 0.06);
            --serif: 'Cormorant Garamond', Georgia, serif;
            --sans: 'Inter', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Very subtle radial glow behind the whole page */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 60% 45% at 50% 30%, rgba(201, 169, 97, 0.05), transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* =========================================
           LAYOUT
           ========================================= */
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 5rem 2rem 4rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================
           LOGO — small, understated, centered
           ========================================= */
        .logo {
            width: 90px;
            height: auto;
            display: block;
            margin-bottom: 2.5rem;
            opacity: 0;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.7));
            animation: softReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        @keyframes softReveal {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           HEADER — thin lines, elegant serif
           ========================================= */
        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 4rem;
        }

        .header-line-top {
            width: 100%;
            max-width: 320px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            margin: 0 auto 2rem;
            opacity: 0;
            animation: lineGrow 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        @keyframes lineGrow {
            0% { opacity: 0; transform: scaleX(0); }
            100% { opacity: 1; transform: scaleX(1); }
        }

        h1 {
            font-family: var(--serif);
            font-size: clamp(2.75rem, 9vw, 4.25rem);
            font-weight: 400;
            letter-spacing: 0.28em;
            line-height: 1;
            color: var(--text);
            text-indent: 0.28em;
            margin-bottom: 1rem;
            opacity: 0;
            animation: softReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        .subtitle {
            font-family: var(--sans);
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.55em;
            text-transform: uppercase;
            color: var(--text-dim);
            text-indent: 0.55em;
            margin-bottom: 2rem;
            opacity: 0;
            animation: softReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
        }

        .subtitle em {
            font-style: normal;
            color: var(--gold);
        }

        .header-line-bottom {
            width: 100%;
            max-width: 320px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            margin: 0 auto;
            opacity: 0;
            animation: lineGrow 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
        }

        /* =========================================
           TEAM ROSTER — horizontal rows
           ========================================= */
        .roster {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .member {
            position: relative;
            display: grid;
            grid-template-columns: 60px 1fr auto;
            align-items: center;
            gap: 1.5rem;
            padding: 1.75rem 0;
            border-bottom: 1px solid var(--line);
            opacity: 0;
            animation: softReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: padding 0.4s ease;
        }

        .member:nth-child(1) { animation-delay: 1.2s; }
        .member:nth-child(2) { animation-delay: 1.35s; }
        .member:nth-child(3) { animation-delay: 1.5s; }

        /* Top border on the first member */
        .member:first-child {
            border-top: 1px solid var(--line);
        }

        .member:hover {
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }

        /* Animated gold underline that slides in on hover */
        .member::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .member:hover::after {
            width: 100%;
        }

        /* Number */
        .member-num {
            font-family: var(--serif);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: var(--text-dim);
            transition: color 0.4s ease;
        }

        .member:hover .member-num {
            color: var(--gold);
        }

        /* Name */
        .member-name {
            font-family: var(--serif);
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: var(--text);
            transition: color 0.4s ease, letter-spacing 0.4s ease;
        }

        .member:hover .member-name {
            color: var(--gold);
            letter-spacing: 0.04em;
        }

        /* Initials on the right */
        .member-initials {
            font-family: var(--sans);
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-dim);
            text-indent: 0.3em;
            transition: color 0.4s ease;
        }

        .member:hover .member-initials {
            color: var(--gold);
        }

        /* =========================================
           FOOTER
           ========================================= */
        .footer {
            margin-top: auto;
            padding-top: 5rem;
            font-family: var(--sans);
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: var(--text-dim);
            text-indent: 0.45em;
            opacity: 0;
            animation: softReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.9s forwards;
        }

        .footer em {
            font-style: normal;
            color: var(--gold);
        }

        /* =========================================
           RESPONSIVE
           ========================================= */
        @media (max-width: 600px) {
            .container { padding: 3rem 1.5rem; }
            .logo { width: 70px; margin-bottom: 2rem; }
            h1 { letter-spacing: 0.2em; text-indent: 0.2em; }
            .subtitle { letter-spacing: 0.4em; text-indent: 0.4em; font-size: 0.6rem; }
            .header { margin-bottom: 3rem; }
            .member { grid-template-columns: 40px 1fr auto; gap: 1rem; padding: 1.4rem 0; }
            .member-name { font-size: 1.15rem; }
            .member-num { font-size: 0.8rem; }
            .member-initials { font-size: 0.6rem; letter-spacing: 0.2em; }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .logo, h1, .subtitle, .header-line-top, .header-line-bottom, .member, .footer {
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>

    <main class="container">

        <!-- LOGO -->
        <img class="logo" src="invictuss.png" alt="Invictus">

        <!-- HEADER -->
        <header class="header">
            <div class="header-line-top"></div>
            <h1>INVICTUS</h1>
            <div class="subtitle">Elite <em>·</em> Team</div>
            <div class="header-line-bottom"></div>
        </header>

        <!-- TEAM ROSTER -->
        <div class="roster">

            <div class="member">
                <span class="member-num">01</span>
                <span class="member-name">Seid Adem</span>
                <span class="member-initials">SA</span>
            </div>

            <div class="member">
                <span class="member-num">02</span>
                <span class="member-name">Huzeyfa Akmel</span>
                <span class="member-initials">HA</span>
            </div>

            <div class="member">
                <span class="member-num">03</span>
                <span class="member-name">Welid Ahmed</span>
                <span class="member-initials">WA</span>
            </div>

        </div>

        <!-- FOOTER -->
        <div class="footer">
            &copy; 2025 <em>Invictus</em>
        </div>

    </main>

</body>
</html>
